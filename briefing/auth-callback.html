<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neosis — Account</title>
  <link rel="icon" href="/assets/neosis-favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="auth-shell auth-shell-premium">
  <main class="auth-card auth-card-premium auth-callback-card">
    <div class="auth-brand auth-brand-center">
      <img src="/assets/neosis-icon.svg" alt="">
      <div><div class="eyebrow">Personal briefing</div><strong>Neosis</strong></div>
    </div>
    <div id="state" class="verification-state">
      <div class="auth-spinner" aria-hidden="true"></div>
      <h1>Verifying your account…</h1>
      <p>One moment while Neosis finishes setting things up.</p>
    </div>
  </main>
<script>
const state=document.querySelector("#state");
const params=new URLSearchParams(location.hash.replace(/^#/,""));
const query=new URLSearchParams(location.search);
const mode=query.get("mode")||params.get("type")||"signup";
const token=params.get("access_token");
const err=params.get("error_description")||params.get("error");

function errorView(message){
  state.innerHTML='<div class="verification-icon error">!</div><h1>This link didn’t work.</h1><p id="callbackError"></p><a class="primary wide auth-link-button" href="/briefing/login.html">Back to Neosis</a>';
  document.querySelector("#callbackError").textContent=message||"The link may have expired. Request a new one from the sign-in page.";
}
async function signupFlow(){
  if(!token)return errorView(err||"This verification link is missing its session. Please request another verification email.");
  try{
    const r=await fetch("/api/auth-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"exchange",accessToken:token})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Could not verify account.");
    state.innerHTML='<div class="verification-icon">✓</div><h1>Email verified.</h1><p>You’re in. Taking you to your Neosis setup…</p>';
    setTimeout(()=>location.replace("/briefing/onboarding.html"),650);
  }catch(e){errorView(e.message);}
}
function recoveryFlow(){
  if(!token)return errorView(err||"This password reset link is invalid or expired.");
  state.innerHTML=`
    <div class="eyebrow">Account recovery</div>
    <h1>Choose a new password.</h1>
    <p>Use at least 8 characters. A longer passphrase is even better.</p>
    <form id="resetForm">
      <div class="field auth-password-field">
        <label for="password">New password</label>
        <div class="password-wrap"><input id="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-target="password">Show</button></div>
      </div>
      <div class="field auth-password-field">
        <label for="confirm">Confirm password</label>
        <div class="password-wrap"><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-target="confirm">Show</button></div>
      </div>
      <div class="password-meter"><span id="meterBar"></span></div>
      <div id="resetMessage" class="auth-message"></div>
      <button class="primary wide auth-submit" id="resetButton">Update password</button>
    </form>`;
  document.querySelectorAll(".password-toggle").forEach(b=>b.onclick=()=>{
    const input=document.querySelector("#"+b.dataset.target);
    input.type=input.type==="password"?"text":"password";
    b.textContent=input.type==="password"?"Show":"Hide";
  });
  const pw=document.querySelector("#password"),meter=document.querySelector("#meterBar");
  pw.addEventListener("input",()=>{
    const v=pw.value;
    const score=[v.length>=8,v.length>=12,/[A-Z]/.test(v)&&/[a-z]/.test(v),/\d|[^A-Za-z]/.test(v)].filter(Boolean).length;
    meter.style.width=(score*25)+"%";
  });
  document.querySelector("#resetForm").onsubmit=async e=>{
    e.preventDefault();
    const button=document.querySelector("#resetButton"),msg=document.querySelector("#resetMessage");
    if(pw.value!==document.querySelector("#confirm").value){msg.textContent="Passwords don’t match.";msg.className="auth-message error";return;}
    button.disabled=true;button.textContent="Updating…";msg.textContent="";
    try{
      const r=await fetch("/api/auth-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset",accessToken:token,password:pw.value})});
      const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not update password.");
      state.innerHTML='<div class="verification-icon">✓</div><h1>Password updated.</h1><p>Your new password is ready to use.</p><a class="primary wide auth-link-button" href="/briefing/login.html">Sign in to Neosis</a>';
      history.replaceState(null,"",location.pathname);
    }catch(ex){msg.textContent=ex.message;msg.className="auth-message error";button.disabled=false;button.textContent="Update password";}
  };
}
if(err&&!token)errorView(err);
else if(mode==="recovery"||params.get("type")==="recovery")recoveryFlow();
else signupFlow();
</script>
</body>
</html>
