<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neosis — Sign in</title><link rel="icon" href="/assets/neosis-favicon.svg?v=cards-20261013"><link rel="stylesheet" href="./styles.css?v=cards-20261013"><link rel="manifest" href="/briefing/manifest.webmanifest?v=cards-20261013"><meta name="theme-color" content="#f6eee6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Neosis"><link rel="apple-touch-icon" href="/assets/neosis-apple-touch-icon.png?v=cards-20261013"></head>
<body class="auth-shell auth-shell-premium"><main class="auth-card auth-card-premium">
<div class="auth-brand"><img src="/assets/neosis-icon.svg?v=cards-20261013" alt=""><div><div class="eyebrow">Personal briefing</div><strong>Neosis</strong></div></div>
<div class="auth-heading"><h1 id="title">Welcome back.</h1><p id="subtitle">Your daily podcast, tuned to what you care about and what you already know.</p></div>
<div class="auth-tabs" id="tabs"><button type="button" class="active" id="signinTab">Sign in</button><button type="button" id="signupTab">Create account</button></div>
<form id="form">
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus></div>
<div class="field auth-password-field" id="passwordField"><div class="auth-label-row"><label for="password">Password</label><button class="auth-inline-link" type="button" id="forgot">Forgot password?</button></div><div class="password-wrap"><input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required><button class="password-toggle" type="button" id="togglePassword">Show</button></div><div class="password-help" id="passwordHelp" hidden>At least 8 characters. A longer passphrase is even better.</div></div>
<div id="message" class="auth-message" aria-live="polite"></div><button class="primary wide auth-submit" id="submit">Sign in</button>
</form>
<div class="auth-trust"><span>Private by default</span><i></i><span>Your learning stays yours</span><i></i><span>Personalized daily</span></div>
</main>
<script>
let mode="signin";const $=s=>document.querySelector(s),si=$("#signinTab"),su=$("#signupTab"),title=$("#title"),sub=$("#subtitle"),btn=$("#submit"),msg=$("#message"),form=$("#form"),password=$("#password"),passwordField=$("#passwordField"),forgot=$("#forgot"),tabs=$("#tabs"),passwordHelp=$("#passwordHelp");
function message(t,type=""){msg.textContent=t||"";msg.className="auth-message"+(type?" "+type:"");}
function setMode(m){mode=m;si.classList.toggle("active",m==="signin");su.classList.toggle("active",m==="signup");password.required=true;passwordField.hidden=false;forgot.hidden=m!=="signin";passwordHelp.hidden=m!=="signup";password.autocomplete=m==="signin"?"current-password":"new-password";title.textContent=m==="signin"?"Welcome back.":"Make Neosis yours.";sub.textContent=m==="signin"?"Your daily podcast, tuned to what you care about and what you already know.":"Create a private briefing, learning model, and library that adapts to you.";btn.textContent=m==="signin"?"Sign in":"Create account";message("");}
function verification(email){tabs.hidden=true;form.innerHTML='<div class="verification-state"><div class="verification-icon">✓</div><h2>Check your inbox.</h2><p>We sent a verification link to <strong id="sentEmail"></strong>.</p><p class="helper">Click it and Neosis will bring you straight back to finish setup.</p><button class="ghost wide" type="button" id="resend">Resend verification email</button><div class="auth-message" id="resendMessage"></div><button class="auth-inline-link auth-back" type="button" id="backToSignin">Use a different email</button></div>';$("#sentEmail").textContent=email;title.textContent="One quick verification.";sub.textContent="This keeps your Neosis account secure.";let left=30;const resend=$("#resend"),rm=$("#resendMessage");const tick=()=>{if(left>0){resend.disabled=true;resend.textContent="Resend in "+left+"s";left--;setTimeout(tick,1000)}else{resend.disabled=false;resend.textContent="Resend verification email"}};tick();resend.onclick=async()=>{resend.disabled=true;rm.textContent="Sending…";try{const r=await fetch("/api/auth-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"resend",email})}),d=await r.json();if(!r.ok)throw new Error(d.error||"Could not resend email.");rm.textContent="Sent. Check your inbox.";rm.className="auth-message success-text";left=30;tick()}catch(e){rm.textContent=e.message;rm.className="auth-message error";resend.disabled=false}};$("#backToSignin").onclick=()=>location.reload();}
function recovery(){mode="recover";tabs.hidden=true;passwordField.hidden=true;password.required=false;title.textContent="Reset your password.";sub.textContent="Enter your email and we’ll send you a secure reset link.";btn.textContent="Send reset link";message("");$("#email").focus();}
function recoverySent(email){form.innerHTML='<div class="verification-state"><div class="verification-icon mail">✉</div><h2>Check your email.</h2><p>If there’s a Neosis account for <strong id="recoverEmail"></strong>, a reset link is on its way.</p><p class="helper">For privacy, we show the same message whether or not an account exists.</p><a href="/briefing/login.html" class="ghost wide auth-link-button">Back to sign in</a></div>';$("#recoverEmail").textContent=email;title.textContent="Reset link requested.";sub.textContent="The link expires automatically for your security.";}
si.onclick=()=>setMode("signin");su.onclick=()=>setMode("signup");forgot.onclick=recovery;$("#togglePassword").onclick=()=>{password.type=password.type==="password"?"text":"password";$("#togglePassword").textContent=password.type==="password"?"Show":"Hide"};
(async()=>{try{const d=await fetch("/api/auth-session").then(r=>r.json());if(d.authenticated)location.replace(d.onboarded?"/briefing/":"/briefing/onboarding.html")}catch{}})();
form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;const email=e.target.email.value.trim();message(mode==="recover"?"Sending reset link…":mode==="signup"?"Creating your account…":"Signing you in…");try{const body={action:mode,email};if(mode!=="recover")body.password=e.target.password.value;const r=await fetch("/api/auth-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||"Authentication failed");if(mode==="recover")return recoverySent(email);if(d.confirmationRequired)return verification(email);location.replace(mode==="signup"?"/briefing/onboarding.html":(new URLSearchParams(location.search).get("next")||"/briefing/"))}catch(err){message(err.message,"error");btn.disabled=false;btn.textContent=mode==="recover"?"Send reset link":mode==="signup"?"Create account":"Sign in"}};
</script></body></html>
