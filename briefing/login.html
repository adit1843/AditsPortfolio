<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neosis — Sign in</title><link rel="icon" href="/assets/neosis-favicon.svg"><link rel="stylesheet" href="./styles.css"></head><body class="auth-shell"><main class="auth-card"><div class="auth-brand"><img src="/assets/neosis-icon.svg" alt=""><div><div class="eyebrow">Personal briefing</div><strong>Neosis</strong></div></div><h1 id="title">Welcome back.</h1><p id="subtitle">Sign in to your private briefing, knowledge model, and archive.</p><div class="auth-tabs"><button class="ghost active" id="signinTab">Sign in</button><button class="ghost" id="signupTab">Create account</button></div><form id="form"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required autofocus></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" autocomplete="current-password" required></div><button class="primary wide" id="submit">Sign in</button><div id="message" class="helper" style="margin-top:12px"></div></form></main><script>
let mode="signin";const si=document.querySelector("#signinTab"),su=document.querySelector("#signupTab"),title=document.querySelector("#title"),sub=document.querySelector("#subtitle"),btn=document.querySelector("#submit"),msg=document.querySelector("#message");function setMode(m){mode=m;si.classList.toggle("active",m==="signin");su.classList.toggle("active",m==="signup");title.textContent=m==="signin"?"Welcome back.":"Create your Neosis.";sub.textContent=m==="signin"?"Sign in to your private briefing, knowledge model, and archive.":"Your account keeps your briefings, preferences, knowledge, and history private and separate from other users.";btn.textContent=m==="signin"?"Sign in":"Create account";msg.textContent="";}si.onclick=()=>setMode("signin");su.onclick=()=>setMode("signup");(async()=>{try{const d=await fetch("/api/auth-session").then(r=>r.json());if(d.authenticated)location.replace(d.onboarded?"/briefing/":"/briefing/onboarding.html");}catch{}})();document.querySelector("#form").onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent="";try{const r=await fetch("/api/auth-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:mode,email:e.target.email.value,password:e.target.password.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||"Authentication failed");if(d.confirmationRequired){
  const email=e.target.email.value.trim();
  document.querySelector("#form").innerHTML=`<div class="verification-state"><div class="verification-icon">✓</div><h2>Check your email</h2><p>We sent a verification link to <strong>${email}</strong>.</p><p class="helper">Open the email and click the verification link. Then come back here and sign in to finish setting up Neosis.</p><button class="ghost wide" type="button" id="backToSignin">Back to sign in</button></div>`;
  title.textContent="Verification email sent.";
  sub.textContent="Your Neosis account is almost ready.";
  document.querySelector(".auth-tabs").style.display="none";
  document.querySelector("#backToSignin").onclick=()=>location.reload();
  return;
}location.replace(mode==="signup"?"/briefing/onboarding.html":(new URLSearchParams(location.search).get("next")||"/briefing/"));}catch(err){msg.textContent=err.message;btn.disabled=false;}};</script></body></html>
