<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neosis</title>
  <link rel="icon" type="image/svg+xml" href="/assets/neosis-favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>
    document.documentElement.classList.add("auth-pending");
    (async()=>{
      try{
        const r=await fetch("/api/auth-session",{cache:"no-store"});
        const d=await r.json();
        if(!d.authenticated){
          location.replace("/briefing/login.html?next="+encodeURIComponent(location.pathname+location.search));
          return;
        }
        if(!d.onboarded){
          location.replace("/briefing/onboarding.html");
          return;
        }
        document.documentElement.classList.remove("auth-pending");
      }catch(e){
        location.replace("/briefing/login.html");
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/assets/neosis-icon.svg" alt="Neosis logo" />
      <div>
        <div class="eyebrow">Personal briefing</div>
        <h1>Neosis</h1>
      </div>
    </div>
    <nav>
      <button data-view="today" class="nav-btn active">Today</button>
      <button data-view="archive" class="nav-btn">Archive</button>
      <button data-view="explainers" class="nav-btn">Library</button>
      <button data-view="tune" class="nav-btn">Tune Neosis</button>
      <a href="/briefing/settings.html" class="nav-btn nav-link">Settings</a>
    </nav>
  </header>

  <main id="app" class="shell"></main>

  <template id="story-template">
    <article class="story-card">
      <div class="story-meta"></div>
      <h2 class="story-title"></h2>
      <p class="story-summary"></p>
      <div class="story-body"></div>
      <div class="story-actions">
        <button class="primary teach-btn">Deep dive</button>
      </div>
      <div class="story-sources"></div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
