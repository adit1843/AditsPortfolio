<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neosis</title>
  <link rel="icon" type="image/svg+xml" href="/assets/neosis-favicon.svg" />
  <link rel="stylesheet" href="./styles.css?v=liquid-glass-1" />
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>
    document.documentElement.classList.add("auth-pending");
    (async()=>{
      try{
        const r=await fetch("/api/auth-session",{cache:"no-store"});
        const d=await r.json();
        if(!d.authenticated){
          location.replace("/briefing/login.html?next="+encodeURIComponent(location.pathname+location.search));
          return;
        }
        if(!d.onboarded){
          location.replace("/briefing/onboarding.html");
          return;
        }
        document.documentElement.classList.remove("auth-pending");
      }catch(e){
        location.replace("/briefing/login.html");
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/briefing/" aria-label="Neosis home">
      <span class="brand-mark" aria-hidden="true">
        <svg class="brand-logo brand-logo-inline" viewBox="0 0 128 128" role="img" aria-label="">
          <rect x="18" y="26" width="25" height="78" rx="9" fill="#153f7a"></rect>
          <rect x="85" y="26" width="25" height="78" rx="9" fill="#153f7a"></rect>
          <path d="M34 29 C49 30 62 44 73 59 C84 75 94 88 110 89 L110 105 C86 105 70 91 57 73 C47 59 39 48 18 47 L18 30 C24 29 29 29 34 29Z" fill="#29d7d3"></path>
          <path d="M64 15 L68 24 L77 28 L68 32 L64 42 L60 32 L51 28 L60 24 Z" fill="#42e4de"></path>
        </svg>
      </span>
      <span class="brand-copy"><strong>Neosis</strong><small>your daily intelligence</small></span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
      <button data-view="today" class="nav-btn active"><span class="nav-icon" aria-hidden="true">●</span><span>Today</span></button>
      <button data-view="archive" class="nav-btn"><span class="nav-icon" aria-hidden="true">▤</span><span>Archive</span></button>
      <button data-view="explainers" class="nav-btn"><span class="nav-icon" aria-hidden="true">◇</span><span>Library</span></button>
      <button data-view="tune" class="nav-btn"><span class="nav-icon" aria-hidden="true">✦</span><span>Tune</span></button>
    </nav>
    <a href="/briefing/settings.html" class="profile-button" aria-label="Settings">
      <span class="settings-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h-.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.36.29.58.71.6 1.17V14c-.02.46-.24.88-.6 1z"></path>
        </svg>
      </span>
      <span class="settings-label">Settings</span>
    </a>
  </header>

  <main id="app" class="shell"></main>

  <aside id="persistentAudioDock" class="persistent-audio-dock" hidden aria-label="Neosis audio player">
    <div class="persistent-audio-copy">
      <span class="eyebrow">Audio edition</span>
      <strong id="persistentAudioLabel">Today's Neosis</strong>
    </div>

    <audio id="briefAudio" controls preload="metadata"></audio>

    <div class="persistent-audio-controls">
      <button class="dock-control dock-skip" id="prevChapterBtn" type="button" aria-label="Previous chapter">←</button>
      <div class="dock-field dock-chapter-field">
        <label for="chapterSelect">Chapter</label>
        <select id="chapterSelect" aria-label="Chapter"></select>
      </div>
      <button class="dock-control dock-skip" id="nextChapterBtn" type="button" aria-label="Next chapter">→</button>
      <div class="dock-field dock-speed-field">
        <label for="audioSpeed">Speed</label>
        <select id="audioSpeed" aria-label="Playback speed">
          <option value="1">1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>
  </aside>

  <template id="story-template">
    <article class="story-card">
      <div class="story-accent" aria-hidden="true"></div>
      <div class="story-meta"></div>
      <h2 class="story-title"></h2>
      <p class="story-summary"></p>
      <div class="story-body"></div>
      <div class="story-actions">
        <button class="primary teach-btn">Deep dive</button>
      </div>
      <div class="story-sources"></div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
