<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Noesis</title>
  <link rel="icon" type="image/svg+xml" href="/assets/noesis-favicon.svg?v=cards-20261013" />
  <link rel="stylesheet" href="./styles.css?v=cards-20261013" />
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>
    document.documentElement.classList.add("auth-pending");
    (async()=>{
      try{
        const r=await fetch("/api/auth-session",{cache:"no-store"});
        const d=await r.json();
        if(!d.authenticated){
          location.replace("/briefing/login.html?next="+encodeURIComponent(location.pathname+location.search));
          return;
        }
        if(!d.onboarded){
          location.replace("/briefing/onboarding.html");
          return;
        }
        document.documentElement.classList.remove("auth-pending");
      }catch(e){
        location.replace("/briefing/login.html");
      }
    })();
  </script>
<link rel="manifest" href="/briefing/manifest.webmanifest?v=cards-20261013"><meta name="theme-color" content="#f6eee6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Noesis"><link rel="apple-touch-icon" href="/assets/noesis-apple-touch-icon.png?v=cards-20261013"></head>
<body>
  <header class="topbar">
    <a class="brand" href="/briefing/" aria-label="Noesis home">
      <span class="brand-mark"><img class="brand-logo" src="/assets/noesis-icon.svg?v=cards-20261013" alt="" /></span>
      <span class="brand-copy"><strong>Noesis</strong><small>your daily intelligence</small></span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
      <button data-view="today" class="nav-btn active"><span>Today</span></button>
      <button data-view="archive" class="nav-btn"><span>Archive</span></button>
      <button data-view="explainers" class="nav-btn"><span>Library</span></button>
      <button data-view="tune" class="nav-btn"><span>Tune</span></button>
    </nav>
    <a href="/briefing/settings.html" class="profile-button" aria-label="Settings">
      <span class="profile-dot"></span>
      <span>Settings</span>
    </a>
  </header>

  <main id="app" class="shell"></main>

  <aside id="persistentAudioDock" class="persistent-audio-dock" hidden aria-label="Noesis audio player">
    <div class="persistent-audio-copy">
      <span class="eyebrow">Audio edition</span>
      <strong id="persistentAudioLabel">Today's Noesis</strong>
    </div>

    <audio id="briefAudio" controls preload="metadata"></audio>

    <div class="persistent-audio-controls">
      <button class="dock-control dock-skip" id="prevChapterBtn" type="button" aria-label="Previous chapter">←</button>
      <div class="dock-field dock-chapter-field">
        <label for="chapterSelect">Chapter</label>
        <select id="chapterSelect" aria-label="Chapter"></select>
      </div>
      <button class="dock-control dock-skip" id="nextChapterBtn" type="button" aria-label="Next chapter">→</button>
      <div class="dock-field dock-speed-field">
        <label for="audioSpeed">Speed</label>
        <select id="audioSpeed" aria-label="Playback speed">
          <option value="1">1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>
  </aside>

  <template id="story-template">
    <article class="story-card">
      <div class="story-accent" aria-hidden="true"></div>
      <div class="story-meta"></div>
      <h2 class="story-title"></h2>
      <p class="story-summary"></p>
      <div class="story-body"></div>
      <div class="story-actions">
        <button class="primary teach-btn">Deep dive</button>
      </div>
      <div class="story-sources"></div>
    </article>
  </template>

  <script src="./app.js?v=cards-20261013"></script>
</body>
</html>
